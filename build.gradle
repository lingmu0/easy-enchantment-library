plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') {
    from('LICENSE')
    includeEmptyDirs = false
    finalizedBy 'reobfJar'
}
tasks.named('processResources', ProcessResources) {
    var properties = [mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
        minecraft_version_range: minecraft_version_range, forge_version_range: forge_version_range,
        loader_version_range: loader_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}
['ledgerTest': 'EnchantmentLedgerTest', 'batchTest': 'EnchantmentBatchTest', 'storageCodecTest': 'LibraryContentsTest'].each { name, testClass ->
    tasks.register(name, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "net.xuwu.enchantmentlibrary.storage.${testClass}"
    }
    tasks.named('check') { dependsOn name }
}
