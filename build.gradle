plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { from('LICENSE'); includeEmptyDirs = false }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var properties = [mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
        minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('ledgerTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.enchantmentlibrary.storage.EnchantmentLedgerTest'
}
tasks.named('check') { dependsOn 'ledgerTest' }

tasks.register('storageCodecTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.enchantmentlibrary.storage.LibraryContentsTest'
}
tasks.named('check') { dependsOn 'storageCodecTest' }

tasks.register('batchTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.xuwu.enchantmentlibrary.storage.EnchantmentBatchTest'
}
tasks.named('check') { dependsOn 'batchTest' }
